<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 11 Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="desktop">
    <!-- Desktop icons – Fluent-style (inspired by official Windows 11 intro) -->
    <div class="desktop-icons" id="desktopIcons">
      <div class="icon" data-app="explorer">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <defs>
              <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFB900"/>
                <stop offset="100%" stop-color="#FF8C00"/>
              </linearGradient>
            </defs>
            <path fill="url(#folderGrad)" d="M6 12h14l4 4h18a4 4 0 014 4v18a4 4 0 01-4 4H6a4 4 0 01-4-4V16a4 4 0 014-4z"/>
            <path fill="#FFD54F" d="M6 16h36v22a2 2 0 01-2 2H8a2 2 0 01-2-2V16z"/>
          </svg>
        </div>
        <span>File Explorer</span>
      </div>
      <div class="icon" data-app="notepad">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <rect x="10" y="6" width="28" height="36" rx="3" fill="#2B88D8"/>
            <rect x="14" y="12" width="20" height="2.5" rx="1" fill="#fff" opacity="0.9"/>
            <rect x="14" y="18" width="16" height="2.5" rx="1" fill="#fff" opacity="0.7"/>
            <rect x="14" y="24" width="18" height="2.5" rx="1" fill="#fff" opacity="0.7"/>
            <rect x="14" y="30" width="12" height="2.5" rx="1" fill="#fff" opacity="0.5"/>
          </svg>
        </div>
        <span>Notepad</span>
      </div>
      <div class="icon" data-app="paint">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="18" fill="#E81123"/>
            <circle cx="16" cy="18" r="6" fill="#FFB900"/>
            <circle cx="32" cy="16" r="5" fill="#00B294"/>
            <circle cx="30" cy="30" r="6" fill="#0078D4"/>
            <path fill="#F2F2F2" d="M20 38l4-10 4 10h-8z"/>
          </svg>
        </div>
        <span>Paint</span>
      </div>
      <div class="icon" data-app="calculator">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <rect x="8" y="4" width="32" height="40" rx="4" fill="#202020"/>
            <rect x="12" y="8" width="24" height="10" rx="2" fill="#0F0F0F"/>
            <rect x="12" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/>
            <rect x="21" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/>
            <rect x="30" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/>
            <rect x="12" y="30" width="7" height="6" rx="1.5" fill="#3A3A3A"/>
            <rect x="21" y="30" width="7" height="6" rx="1.5" fill="#3A3A3A"/>
            <rect x="30" y="30" width="7" height="6" rx="1.5" fill="#0078D4"/>
            <rect x="12" y="38" width="16" height="4" rx="1.5" fill="#3A3A3A"/>
            <rect x="30" y="38" width="7" height="4" rx="1.5" fill="#3A3A3A"/>
          </svg>
        </div>
        <span>Calculator</span>
      </div>
      <div class="icon" data-app="music">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="20" fill="#881798"/>
            <path fill="#fff" d="M28 12v16.5a5.5 5.5 0 11-3-4.9V17l10-2v11.5a5.5 5.5 0 11-3-4.9V12h-4z"/>
          </svg>
        </div>
        <span>Music</span>
      </div>
      <div class="icon" data-app="terminal">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <rect x="4" y="8" width="40" height="32" rx="4" fill="#0C0C0C"/>
            <rect x="4" y="8" width="40" height="8" rx="4" fill="#1A1A1A"/>
            <circle cx="12" cy="12" r="2" fill="#E81123"/>
            <circle cx="20" cy="12" r="2" fill="#FFB900"/>
            <circle cx="28" cy="12" r="2" fill="#00B294"/>
            <path fill="#0CFF00" d="M12 24l6 4-6 4v-2.5l3-1.5-3-1.5V24zm10 7h10v2.5H22V31z"/>
          </svg>
        </div>
        <span>Terminal</span>
      </div>
      <div class="icon" data-app="sticky">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <path fill="#FFF176" d="M8 6h28a2 2 0 012 2v28l-8 8H8a2 2 0 01-2-2V8a2 2 0 012-2z"/>
            <path fill="#FBC02D" d="M30 36v8l8-8H30z"/>
            <rect x="14" y="16" width="18" height="2.5" rx="1" fill="#F9A825" opacity="0.7"/>
            <rect x="14" y="22" width="14" height="2.5" rx="1" fill="#F9A825" opacity="0.5"/>
          </svg>
        </div>
        <span>Sticky Notes</span>
      </div>
      <div class="icon" data-app="browser">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="20" fill="#0078D4"/>
            <circle cx="24" cy="24" r="14" fill="none" stroke="#50E6FF" stroke-width="2.5"/>
            <ellipse cx="24" cy="24" rx="7" ry="14" fill="none" stroke="#50E6FF" stroke-width="2"/>
            <path fill="none" stroke="#50E6FF" stroke-width="2" d="M10 24h28M12 16h24M12 32h24"/>
          </svg>
        </div>
        <span>Browser</span>
      </div>
      <div class="icon" data-app="settings">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="8" fill="#C8C8C8"/>
            <path fill="#A0A0A0" d="M24 4l2.5 5.5 6-.8 1.8 5.7 5.5-2.2 3.2 5-4.8 3.5 4.8 3.5-3.2 5-5.5-2.2-1.8 5.7-6-.8L24 44l-2.5-5.5-6 .8-1.8-5.7-5.5 2.2-3.2-5 4.8-3.5L7 21.5l3.2-5 5.5 2.2 1.8-5.7 6 .8L24 4z"/>
            <circle cx="24" cy="24" r="5" fill="#2C2C2C"/>
          </svg>
        </div>
        <span>Settings</span>
      </div>
      <div class="icon" data-app="about">
        <div class="icon-img win11-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="20" fill="#0078D4"/>
            <circle cx="24" cy="16" r="3.5" fill="#fff"/>
            <rect x="21" y="22" width="6" height="14" rx="2" fill="#fff"/>
          </svg>
        </div>
        <span>About</span>
      </div>
    </div>

    <div id="windows"></div>

    <div id="taskbar">
      <div class="taskbar-left">
        <button id="startBtn" title="Start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
          </svg>
        </button>
        <button id="searchBtn" title="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
        </button>
      </div>
      <div class="taskbar-center" id="taskbarApps"></div>
      <div class="taskbar-right">
        <div class="tray" id="tray">
          <span id="networkIcon" title="Network">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          </span>
          <span id="volumeIcon" title="Volume">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </span>
          <span id="batteryIcon" title="Battery">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </span>
        </div>
        <div class="datetime" id="datetime">
          <div id="time">00:00</div>
          <div id="date">Mon 01</div>
        </div>
      </div>
    </div>

    <div id="startMenu" class="hidden">
      <div class="start-search">
        <input type="text" id="startSearch" placeholder="Search for apps, settings..." />
      </div>
      <div class="start-pinned">
        <h3>Pinned</h3>
        <div class="pinned-grid">
          <div class="pinned" data-app="explorer">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><defs><linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFB900"/><stop offset="100%" stop-color="#FF8C00"/></linearGradient></defs><path fill="url(#fg)" d="M6 12h14l4 4h18a4 4 0 014 4v18a4 4 0 01-4 4H6a4 4 0 01-4-4V16a4 4 0 014-4z"/><path fill="#FFD54F" d="M6 16h36v22a2 2 0 01-2 2H8a2 2 0 01-2-2V16z"/></svg></span>
            <span>Explorer</span>
          </div>
          <div class="pinned" data-app="notepad">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><rect x="10" y="6" width="28" height="36" rx="3" fill="#2B88D8"/><rect x="14" y="12" width="20" height="2.5" rx="1" fill="#fff" opacity="0.9"/><rect x="14" y="18" width="16" height="2.5" rx="1" fill="#fff" opacity="0.7"/><rect x="14" y="24" width="18" height="2.5" rx="1" fill="#fff" opacity="0.7"/></svg></span>
            <span>Notepad</span>
          </div>
          <div class="pinned" data-app="paint">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><circle cx="24" cy="24" r="18" fill="#E81123"/><circle cx="16" cy="18" r="6" fill="#FFB900"/><circle cx="32" cy="16" r="5" fill="#00B294"/><circle cx="30" cy="30" r="6" fill="#0078D4"/></svg></span>
            <span>Paint</span>
          </div>
          <div class="pinned" data-app="calculator">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><rect x="8" y="4" width="32" height="40" rx="4" fill="#202020"/><rect x="12" y="8" width="24" height="10" rx="2" fill="#0F0F0F"/><rect x="12" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/><rect x="21" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/><rect x="30" y="22" width="7" height="6" rx="1.5" fill="#3A3A3A"/><rect x="30" y="30" width="7" height="6" rx="1.5" fill="#0078D4"/></svg></span>
            <span>Calculator</span>
          </div>
          <div class="pinned" data-app="music">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><circle cx="24" cy="24" r="20" fill="#881798"/><path fill="#fff" d="M28 12v16.5a5.5 5.5 0 11-3-4.9V17l10-2v11.5a5.5 5.5 0 11-3-4.9V12h-4z"/></svg></span>
            <span>Music</span>
          </div>
          <div class="pinned" data-app="terminal">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><rect x="4" y="8" width="40" height="32" rx="4" fill="#0C0C0C"/><rect x="4" y="8" width="40" height="8" rx="4" fill="#1A1A1A"/><circle cx="12" cy="12" r="2" fill="#E81123"/><circle cx="20" cy="12" r="2" fill="#FFB900"/><circle cx="28" cy="12" r="2" fill="#00B294"/><path fill="#0CFF00" d="M12 24l6 4-6 4v-2.5l3-1.5-3-1.5V24z"/></svg></span>
            <span>Terminal</span>
          </div>
          <div class="pinned" data-app="sticky">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><path fill="#FFF176" d="M8 6h28a2 2 0 012 2v28l-8 8H8a2 2 0 01-2-2V8a2 2 0 012-2z"/><path fill="#FBC02D" d="M30 36v8l8-8H30z"/></svg></span>
            <span>Sticky</span>
          </div>
          <div class="pinned" data-app="browser">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><circle cx="24" cy="24" r="20" fill="#0078D4"/><circle cx="24" cy="24" r="14" fill="none" stroke="#50E6FF" stroke-width="2.5"/><ellipse cx="24" cy="24" rx="7" ry="14" fill="none" stroke="#50E6FF" stroke-width="2"/><path fill="none" stroke="#50E6FF" stroke-width="2" d="M10 24h28"/></svg></span>
            <span>Browser</span>
          </div>
          <div class="pinned" data-app="settings">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><circle cx="24" cy="24" r="8" fill="#C8C8C8"/><path fill="#A0A0A0" d="M24 4l2.5 5.5 6-.8 1.8 5.7 5.5-2.2 3.2 5-4.8 3.5 4.8 3.5-3.2 5-5.5-2.2-1.8 5.7-6-.8L24 44l-2.5-5.5-6 .8-1.8-5.7-5.5 2.2-3.2-5 4.8-3.5L7 21.5l3.2-5 5.5 2.2 1.8-5.7 6 .8L24 4z"/><circle cx="24" cy="24" r="5" fill="#2C2C2C"/></svg></span>
            <span>Settings</span>
          </div>
          <div class="pinned" data-app="about">
            <span class="pinned-icon"><svg viewBox="0 0 48 48" width="28" height="28"><circle cx="24" cy="24" r="20" fill="#0078D4"/><circle cx="24" cy="16" r="3.5" fill="#fff"/><rect x="21" y="22" width="6" height="14" rx="2" fill="#fff"/></svg></span>
            <span>About</span>
          </div>
        </div>
      </div>
      <div class="start-footer">
        <div class="user">
          <div class="avatar">U</div>
          <span>User</span>
        </div>
        <button id="powerBtn" title="Power">⏻</button>
      </div>
    </div>

    <div id="powerMenu" class="hidden">
      <button data-action="reload">Restart (Reload)</button>
      <button data-action="lock">Lock Screen</button>
    </div>

    <div id="lockScreen" class="hidden">
      <div class="lock-time" id="lockTime">00:00</div>
      <div class="lock-date" id="lockDate"></div>
      <button id="unlockBtn">Click to unlock</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
